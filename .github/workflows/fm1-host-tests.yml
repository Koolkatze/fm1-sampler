name: FM-1 Sampler host tests

on:
  push:
    branches: [feature/fm1-cue-beat-repeat]
  pull_request:
    paths:
      - "engine/**"
      - "firmware/app/ctrl.c"
      - ".github/workflows/fm1-host-tests.yml"

jobs:
  engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile sampler and test harness
        run: |
          make -C engine -j2 all
          make -C engine "$GITHUB_WORKSPACE/engine/build/test_app"
      - name: Provide sample library
        run: |
          mkdir -p "$HOME/fm1-sampler"
          ln -s "$GITHUB_WORKSPACE/samples" "$HOME/fm1-sampler/samples"
      - name: Run engine regression tests
        run: ./engine/build/test_app

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components using preinstalled command-line tools
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build FM-1 Sampler CUE APK
        run: cd android && gradle :app:assembleDebug --no-daemon
      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Sampler-CUE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
