name: Publish FM1-SAMPLER library preview

on:
  push:
    branches: [feature/oneshot-packs-on-scenes]
    paths:
      - 'android/app/build.gradle'
      - 'android/app/src/main/java/**'
      - 'engine/**'
      - 'firmware/app/ctrl.c'
      - 'firmware/hosttest/ctrl_host.c'
      - '.github/workflows/publish-fm1-library-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm1-library-preview-publish
  cancel-in-progress: true

jobs:
  publish-library-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check sampler regression tests
        run: |
          make -C engine -j2 all
          make -C engine "$GITHUB_WORKSPACE/engine/build/test_app"
          mkdir -p "$HOME/fm1-sampler"
          ln -s "$GITHUB_WORKSPACE/samples" "$HOME/fm1-sampler/samples"
          ./engine/build/test_app
      - name: Verify USB MIDI controller octave chord
        run: |
          mkdir -p firmware/build/host
          cc -std=c11 -O2 -DFM1_HOST_TEST -I firmware/sdk/include -I firmware/app -I firmware/app/synth \
            firmware/hosttest/ctrl_host.c -lm -o firmware/build/host/ctrl_host
          ./firmware/build/host/ctrl_host
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 8
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Stage and check APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FM1-Sampler-Library-0.38.5-preview.apk
          unzip -t dist/FM1-Sampler-Library-0.38.5-preview.apk | tail -n 1
          sha256sum dist/FM1-Sampler-Library-0.38.5-preview.apk
      - name: Publish on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.38-library-preview.6
        run: |
          cat > release-notes.md <<'EOF'
          ## FM1 Sampler 0.38.5 — Restored LIBRARY and NOTE REPEAT triplets

          **Installable APK:** `FM1-Sampler-Library-0.38.5-preview.apk` (Android debug prerelease).

          - **HOME folder icon LIBRARY:** opens the original in-app library panel (not Android's external document browser). Its four root directories, file-type icons, ENTER/BACK controls and **+ IMPORT ZIP** are restored.
          - **IMPORT ZIP** opens Android's document picker specifically to select an external ZIP, then extracts the archive under `FM1-SAMPLER/PACKS` without deleting the source ZIP.
          - **PRESETS knob and library touch selection** share one cursor. Moving to a WAV immediately loads it into the selected track as a preset. ENTER only opens selected folders; BACK goes up one directory.
          - **OCT+ + OCT- together** (in either press order) instantly shows the NOTE REPEAT rate page. No long press or PLAY is required to open the menu; K1 chooses the rate.
          - **All six straight and six triplet note divisions:** 1/1, 1/1T, 1/2, 1/2T, 1/4, 1/4T, 1/8, 1/8T, 1/16, 1/16T, 1/32, 1/32T. A triplet repeat lasts 2/3 of the corresponding straight division at the session BPM.
          - **OCT+ + PLAY** remains momentary NOTE REPEAT; **OCT- + PLAY** remains immediate loop restart. Releasing PLAY returns to the original loop without altering saved audio.
          - Existing FMP2 project archives and WAV loops remain compatible. Old project setting v2 straight divisions are remapped to their equivalent v3 index on load; no samples or audio data are removed.
          - **Firmware source:** `firmware/app/ctrl.c` marks both octave buttons as consumed in the menu combination, so releasing them does not shift the keyboard. Host firmware simulation is included in CI. The repository's previously bundled `.fwsc` **has not been rebuilt**, and this APK **does not flash firmware**. A physical FM-1 must run firmware forwarding OCT+ / OCT- USB MIDI Note On/Off to detect the combination.
          - Separate debugging note: debug-signed GitHub APKs may not share a stable key. **Never uninstall an old version containing irreplaceable project/loop data without a tested backup.** Package ID for this APK is `com.ferluht.fm1sampler.scenes`.

          **Validation:** Automated engine/navigation/audio tests, FM-1 controller source host simulation, and Android APK compilation. Hardware behavior remains unverified on the actual device.

          Source: [FM1 Sampler development](https://github.com/Koolkatze/fm1-sampler/pull/3).
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FM1-Sampler-Library-0.38.5-preview.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" dist/FM1-Sampler-Library-0.38.5-preview.apk               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "FM1 Sampler 0.38.5 — LIBRARY restored and triplet NOTE REPEAT"               --notes-file release-notes.md               --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease             --jq '{url: .url, isPrerelease: .isPrerelease, files: [.assets[].name]}'
