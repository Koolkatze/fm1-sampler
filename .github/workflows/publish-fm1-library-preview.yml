name: Publish FM1-SAMPLER library preview

on:
  push:
    branches: [feature/oneshot-packs-on-scenes]
    paths:
      - 'android/app/build.gradle'
      - 'android/app/src/main/java/**'
      - 'android/app/src/test/java/**'
      - 'engine/**'
      - 'firmware/app/ctrl.c'
      - 'firmware/hosttest/ctrl_host.c'
      - '.github/workflows/publish-fm1-library-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm1-library-preview-publish
  cancel-in-progress: true

jobs:
  publish-library-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check sampler regression tests
        run: |
          make -C engine -j2 all
          make -C engine "$GITHUB_WORKSPACE/engine/build/test_app"
          mkdir -p "$HOME/fm1-sampler"
          ln -s "$GITHUB_WORKSPACE/samples" "$HOME/fm1-sampler/samples"
          ./engine/build/test_app
      - name: Verify USB MIDI controller octave chord
        run: |
          mkdir -p firmware/build/host
          cc -std=c11 -O2 -DFM1_HOST_TEST -I firmware/sdk/include -I firmware/app -I firmware/app/synth \
            firmware/hosttest/ctrl_host.c -lm -o firmware/build/host/ctrl_host
          ./firmware/build/host/ctrl_host
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify FM1-SAMPLER whole-library backup and safe restore
        run: |
          mkdir -p /tmp/fm1-backup-java-test
          javac -d /tmp/fm1-backup-java-test \
            android/app/src/main/java/com/ferluht/fm1sampler/LibraryBackupArchive.java \
            android/app/src/test/java/com/ferluht/fm1sampler/LibraryBackupArchiveHostTest.java
          java -cp /tmp/fm1-backup-java-test com.ferluht.fm1sampler.LibraryBackupArchiveHostTest
      - name: Install Android toolchain
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 8
          done
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Stage and check APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FM1-Sampler-Library-0.38.7-preview.apk
          unzip -t dist/FM1-Sampler-Library-0.38.7-preview.apk | tail -n 1
          sha256sum dist/FM1-Sampler-Library-0.38.7-preview.apk
      - name: Publish on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.38-library-preview.8
        run: |
          cat > release-notes.md <<'EOF'
          ## FM1 Sampler 0.38.7 — Enlarged waveform-side track badge and portable backups

          **Installable Android APK:** `FM1-Sampler-Library-0.38.7-preview.apk`.

          - **HOME selected track:** the **T1–T8** badge is now large and clearly positioned directly to the **left of the sample waveform viewer**, not beside the dark/light theme icon. Tap it to cycle tracks.
          - Inside **HOME → LIBRARY**, alongside **+ IMPORT ZIP**, two buttons now work: **SAVE BACKUP** and **IMPORT BACKUP**.
          - **SAVE BACKUP** lets you choose a user-owned ZIP location through Android's Create Document picker (Downloads, Documents, USB or compatible cloud). The ZIP contains the full already-saved FM1-SAMPLER library: complete FMP2 project slots, current saved scene/SONG files, loops WAVs, recordings, imported audio, OFFICIAL instruments, PACKS, nested folders and non-audio files.
          - **IMPORT BACKUP** picks a ZIP and verifies every file with SHA-256 and a versioned manifest, rejecting corrupted archives, duplicates and unsafe paths before restoration.
          - **KEEP EXISTING** merges only missing files. **REPLACE** requires additional confirmation, and safeguards previous originals in an independent FM1-SAMPLER-RECOVERY directory. No silent overwrite.
          - Backup operations are asynchronous and blocked during recording or a full-project save/load. Reopen the app after importing to load restored files.
          - The in-app LIBRARY panel, IMPORT ZIP, PRESETS auto-load navigation, OCT+ / OCT- note-repeat menu, straight and triplet divisions, MIDI transport and complete saved projects are retained.
          - **Save the active project BEFORE saving a backup:** unsaved in-memory playback/loop changes are not files yet, and therefore cannot be included in a file backup.
          - **Same signing caveat:** GitHub debug releases can have different signing keys. Do NOT uninstall a prior app with irreplaceable projects/loops until a saved backup is verified and accessible outside the app. Use this portable ZIP to migrate between APK packages without requiring ADB.
          - **Firmware:** no physical FM-1 flash is performed; only Android app code changes are in this release.

          **Verification:** Host C++ and FM-1 MIDI panel tests; standalone host Java tests for exact backup round trips, KEEP vs REPLACE, preserved originals, path traversal and invalid archives; Android Gradle APK compilation. Physical Android document provider operations are not yet validated on a real device.

          Source: [FM1 Sampler development](https://github.com/Koolkatze/fm1-sampler/pull/3).
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FM1-Sampler-Library-0.38.7-preview.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md --prerelease
          else
            gh release create "$TAG" dist/FM1-Sampler-Library-0.38.7-preview.apk               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "FM1 Sampler 0.38.7 — Larger track badge and portable backups"               --notes-file release-notes.md               --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets,isPrerelease             --jq '{url: .url, isPrerelease: .isPrerelease, files: [.assets[].name]}'
