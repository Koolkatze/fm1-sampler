name: Publish FM1 Sampler Scenes Android preview

on:
  push:
    branches: [feature/scene-launcher-song-mode]
    paths:
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - 'android/app/src/main/java/**'
      - 'engine/**'
      - '.github/workflows/publish-scenes-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm1-scenes-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Scenes source
        uses: actions/checkout@v4

      - name: Run sampler transport and UI regression suite
        run: |
          make -C engine -j2 all
          make -C engine "$GITHUB_WORKSPACE/engine/build/test_app"
          mkdir -p "$HOME/fm1-sampler"
          ln -s "$GITHUB_WORKSPACE/samples" "$HOME/fm1-sampler/samples"
          ./engine/build/test_app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              break
            fi
            echo "SDK installation attempt $attempt failed"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 8
          done

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK with monochrome cassette and orange dot launcher icon
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect and stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FM1-Sampler-Scenes-SongMode.apk
          unzip -t dist/FM1-Sampler-Scenes-SongMode.apk | tail -n 1
          unzip -l dist/FM1-Sampler-Scenes-SongMode.apk | grep -E 'ic_launcher|AndroidManifest'
          sha256sum dist/FM1-Sampler-Scenes-SongMode.apk

      - name: Publish APK in new GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.37-scenes-preview.9
        run: |
          cat > release-notes.md <<'EOF'
          ## FM1 Sampler — complete projects (COMPOSE + LOOPS + SONG)

          **Install the attached `FM1-Sampler-Scenes-SongMode.apk` on Android.**

          ### NEW: save and reload complete project sessions

          - **PROJECT > SAVE PROJECT / LOAD PROJECT:** eight independent named-numbered project slots, with a slot picker. Replacing an existing save or loading over your current work requires a second confirmation.
          - Every complete project stores the precise current eight-track recorded clips; an independent copy of COMPOSE even if the save is made in LOOP/SONG mode; all 12 saved scenes and their original loop audio; the ordered SONG arrangement and its current playback position; the selected scene, live loop transport and tempo.
          - All eight sample-source WAV files are embedded inside each self-contained `.fm1p` archive and rehydrated on load, with the original sample names. Sample ranges and processing, synth modes, tuning, envelope, LFO, arpeggiator, filters, sidechain, mix, sends, global effects, loop speed/source and NOTE REPEAT division are saved.
          - Archives are atomically committed (old project preserved until new file is complete) with a 64-bit whole-file integrity checksum; corrupted/truncated files are rejected without changing the active project.
          - Song-mode saves reopen in SONG, mid-song playback resumes, and HOME/EXIT afterward restores the correct COMPOSE loops instead of replacing them with the active scene. Save/load is refused during active recording to avoid capturing incomplete takes.
          - Project files live in the phone application's private storage as `project_1.fm1p` through `project_8.fm1p`. These local saves are NOT automatic external backups. An uninstall can erase all projects. Preserve existing recordings before removing a differently-signed debug APK.
          - Includes regression tests saving/loading both COMPOSE and SONG while retaining embedded WAVs, clips, scene bank, arrangements, user settings, sample names, theme UI, and rejection of a deliberately corrupt project file.

          - **Compact shortcut help on the phone's main deck:** the exact label **OCT− + PLAY/STOP: RESTART LOOP** is shown above OCT+ + PLAY/STOP (NOTE REPEAT, K1=1/1..1/32). Use the small HIDE/INFO control to collapse/reopen; the preference persists between app launches. The guide adopts the existing Light/Dark palette and does not trigger any audio action. There are **no new OCT buttons on the phone**.
          - **Physical OCT− held first, THEN PLAY/STOP:** restart the loop immediately on PLAY/STOP press. Pressing OCT− after PLAY/STOP is already down does not trigger restart.
          - **Physical OCT+ held first, THEN PLAY/STOP:** momentary BPM-synced NOTE REPEAT from the current position. While holding PLAY/STOP, physical K1 selects 1/1, 1/2, 1/4, 1/8, 1/16 or 1/32. Releasing PLAY/STOP (or OCT+) exits the effect without changing the recorded loop.
          - On the real FM-1, **PLAY and STOP are the same physical PLAY/STOP key**. The custom physical controller firmware must forward OCT and PLAY MIDI note-on/note-off messages for these shortcuts to work. A firmware which does not forward them cannot be fixed by the APK alone.
          - **Fixed loss of recorded loops when leaving LOOP/SONG:** entering performance takes a copy-on-write snapshot of all eight track clips and the loop transport. EXIT, COMPOSE or hardware HOME restores the original composition's loops and sample assignments, not the currently playing scene.
          - **Normal PLAY/STOP without OCT:** toggles transport immediately on key-down, regardless of the previous combo. OCT released before PLAY means an ordinary transport press, with no repeat or restart latch.
          - **Improved USB/BLE MIDI discovery:** accept a connected receiver-only MIDI port and a single unidentified MIDI output device. The INFO legend now contains a small read-only incoming MIDI monitor showing whether OCT−, OCT+, PLAY and K1 messages have actually arrived, the most recent channel/event, and the currently held modifier. Separate MIDI callbacks are supported with no simultaneity requirement.
          - Retains the cassette-tape icon with split white/black and orange dot.
          - LOOP MODE C1–B1, SONG MODE, Project scene persistence and the original sample editor remain.
          - Package: `com.ferluht.fm1sampler.scenes`.
          - Preview version: 0.37.8-scenes-test (versionCode 45).

          Validation: host tests exercise non-simultaneous physical OCT/PLAY MIDI callbacks, strict modifier ordering, diagnostic event rendering, NOTE REPEAT / restart, exact restoration of recorded loops, scene/song switching and both Light/Dark modes. Android compilation uses the updated MIDI receiver.

          **Hardware requirement:** For buttons to work, the installed FM-1 firmware must actually transmit MIDI channel 2 Note On/Off (notes 0 for OCT−, 1 for OCT+, 12 for physical PLAY/STOP) and encoder K1 as MIDI CC. The APK cannot create button messages that the device firmware never sends. This Release updates the phone app; it does not flash the physical firmware.

          **Important:** GitHub builds of this preview use the Android default
          debug signing key, which can differ between CI runs. If Android
          refuses to update an earlier preview due to a signing mismatch, do
          not uninstall until you have safeguarded any project data. An
          uninstall may erase the app's privately stored scenes and songs.

          A Nothing OS monochrome icon pack may recolor app icons regardless
          of the original APK asset. To retain the split white/black and orange
          in the launcher, choose the original/default icon presentation
          rather than a forced monochrome icon pack.

          Source: [Scenes + Song Mode](https://github.com/Koolkatze/fm1-sampler/pull/2).
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FM1-Sampler-Scenes-SongMode.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/FM1-Sampler-Scenes-SongMode.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FM1 Sampler — save complete projects with all clips, song and samples" \
              --notes-file release-notes.md \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,assets,isPrerelease \
            --jq '{url: .url, isPrerelease: .isPrerelease, files: [.assets[].name]}'
