name: Publish FM1 Sampler Scenes Android preview

on:
  push:
    branches: [feature/scene-launcher-song-mode]
    paths:
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/res/**'
      - 'android/app/build.gradle'
      - 'engine/**'
      - '.github/workflows/publish-scenes-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fm1-scenes-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Scenes source
        uses: actions/checkout@v4

      - name: Run sampler transport and UI regression suite
        run: |
          make -C engine -j2 all
          make -C engine "$GITHUB_WORKSPACE/engine/build/test_app"
          mkdir -p "$HOME/fm1-sampler"
          ln -s "$GITHUB_WORKSPACE/samples" "$HOME/fm1-sampler/samples"
          ./engine/build/test_app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK and CMake
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"; then
              break
            fi
            echo "SDK installation attempt $attempt failed"
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 8
          done

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK with monochrome cassette and orange dot launcher icon
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Inspect and stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/FM1-Sampler-Scenes-SongMode.apk
          unzip -t dist/FM1-Sampler-Scenes-SongMode.apk | tail -n 1
          unzip -l dist/FM1-Sampler-Scenes-SongMode.apk | grep -E 'ic_launcher|AndroidManifest'
          sha256sum dist/FM1-Sampler-Scenes-SongMode.apk

      - name: Publish APK in new GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.37-scenes-preview.5
        run: |
          cat > release-notes.md <<'EOF'
          ## FM1 Sampler Scenes — NOTE REPEAT + physical shortcuts reference

          **Install the attached `FM1-Sampler-Scenes-SongMode.apk` on Android.**

          - **Compact shortcut help on the phone's main deck:** two informative lines show OCT− + PLAY/STOP (RESTART LOOP), and OCT+ + PLAY/STOP (NOTE REPEAT, K1=1/1..1/32). Use the small HIDE/INFO control to collapse/reopen; the preference persists between app launches. The guide adopts the existing Light/Dark palette and does not trigger any audio action. There are **no new OCT buttons on the phone**.
          - **Physical OCT− + PLAY/STOP:** restart the loop immediately on the second button press, including when the loop was stopped; no one-second hold is required.
          - **Physical OCT+ + held PLAY/STOP:** momentary BPM-synced NOTE REPEAT from the current position. While holding, physical K1 selects 1/1, 1/2, 1/4, 1/8, 1/16 or 1/32. Releasing PLAY/STOP returns to the unchanged recorded loop.
          - On the real FM-1, **PLAY and STOP are the same physical PLAY/STOP key**. The custom physical controller firmware must forward OCT and PLAY MIDI note-on/note-off messages for these shortcuts to work. A firmware which does not forward them cannot be fixed by the APK alone.
          - **LOOP MODE / SONG MODE** can be exited using EXIT beside LAUNCH or COMPOSE, and HOME also returns to composition.
          - Retains the cassette-tape icon with split white/black and orange dot.
          - LOOP MODE C1–B1, SONG MODE, Project scene persistence and the original sample editor remain.
          - Package: `com.ferluht.fm1sampler.scenes`.
          - Preview version: 0.37.4-scenes-test (versionCode 41).

          Validation: host regression tests passed for physical CUE, K1 live rate, immediate OCT− restart, no synthetic phone octave buttons, scene switching and Song Mode. The APK was rebuilt with those sources.

          **Important:** GitHub builds of this preview use the Android default
          debug signing key, which can differ between CI runs. If Android
          refuses to update an earlier preview due to a signing mismatch, do
          not uninstall until you have safeguarded any project data. An
          uninstall may erase the app's privately stored scenes and songs.

          A Nothing OS monochrome icon pack may recolor app icons regardless
          of the original APK asset. To retain the split white/black and orange
          in the launcher, choose the original/default icon presentation
          rather than a forced monochrome icon pack.

          Source: [Scenes + Song Mode](https://github.com/Koolkatze/fm1-sampler/pull/2).
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FM1-Sampler-Scenes-SongMode.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/FM1-Sampler-Scenes-SongMode.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FM1 Sampler Scenes — NOTE REPEAT and physical shortcuts help" \
              --notes-file release-notes.md \
              --prerelease
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json url,assets,isPrerelease \
            --jq '{url: .url, isPrerelease: .isPrerelease, files: [.assets[].name]}'
