plugins { id 'com.android.application' }
android {
    namespace 'com.ferluht.fm1sampler'
    compileSdk 34
    defaultConfig { applicationId 'com.ferluht.fm1sampler'; minSdk 23; targetSdk 30; versionCode 59; versionName "0.38.12" }
    // GitHub previews must reuse one private signing identity forever.
    // Local developers without the environment variables keep an ordinary
    // debug APK; the publish workflow refuses to release such an APK.
    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            def keyPath = System.getenv('FM1_SIGNING_STORE_FILE')
            def storePass = System.getenv('FM1_SIGNING_STORE_PASSWORD')
            def keyAliasName = System.getenv('FM1_SIGNING_KEY_ALIAS')
            def keyPass = System.getenv('FM1_SIGNING_KEY_PASSWORD')
            if (keyPath && storePass && keyAliasName && keyPass) {
                storeFile file(keyPath)
                storePassword storePass
                keyAlias keyAliasName
                keyPassword keyPass
            }
        }
    }
    // The GitHub-built preview installs separately from production / CUE FM-1 Sampler.
    buildTypes {
        debug {
            applicationIdSuffix '.scenes'
            versionNameSuffix '-scenes-test'
            manifestPlaceholders = [appLabel: 'FM1 Sampler Scenes']
        }
        release {
            manifestPlaceholders = [appLabel: 'FM1 Sampler']
        }
    }
    buildFeatures { prefab true }
    defaultConfig { externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '' } }; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    ndkVersion '27.2.12479018'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.oboe:oboe:1.9.0' }
